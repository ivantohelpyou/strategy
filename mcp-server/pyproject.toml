[project]
name = "strategy-mcp"
version = "0.1.0"
description = "MCP server for strategy — generated by SEA crab"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "psycopg2-binary",
]

# This directory is a script to run, not a package to build. Without this uv
# tries to build it on `uv run server.py` and fails before the server starts.
[tool.uv]
package = false
